services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: helios, POSTGRES_PASSWORD: helios, POSTGRES_DB: helios }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  backend:
    build: .
    environment:
      DATABASE_URL: postgres://helios:helios@db:5432/helios?sslmode=disable
    ports: ["8080:8080"]
    depends_on: [db]
volumes: { pgdata: {} }
